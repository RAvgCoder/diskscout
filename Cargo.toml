[package]
name = "diskscout"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "diskscout"
path = "src/main.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dependencies]
walkdir   = "2"
rayon     = "1"
clap      = { version = "4", features = ["derive"] }
clap_complete = "4"
colored   = "3"
indicatif = "0.18"

[dev-dependencies]
tempfile = "3.27.0"
